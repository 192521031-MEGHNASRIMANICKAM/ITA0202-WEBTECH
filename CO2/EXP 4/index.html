<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Result Analysis</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h2>Student Result Analysis</h2>

<input type="text" id="name" placeholder="Student Name">

<input type="number" id="m1" placeholder="Subject 1 Marks">

<input type="number" id="m2" placeholder="Subject 2 Marks">

<input type="number" id="m3" placeholder="Subject 3 Marks">

<input type="number" id="m4" placeholder="Subject 4 Marks">

<input type="number" id="m5" placeholder="Subject 5 Marks">

<button onclick="analyzeResult()">Analyze Result</button>

<table>

<tr>
<th>Student</th>
<td id="student"></td>
</tr>

<tr>
<th>Total</th>
<td id="total"></td>
</tr>

<tr>
<th>Average</th>
<td id="average"></td>
</tr>

<tr>
<th>Highest Mark</th>
<td id="highest"></td>
</tr>

<tr>
<th>Lowest Mark</th>
<td id="lowest"></td>
</tr>

<tr>
<th>Grade</th>
<td id="grade"></td>
</tr>

<tr>
<th>Result</th>
<td id="result"></td>
</tr>

</table>

</div>

<script src="script.js"></script>

</body>
</html>
