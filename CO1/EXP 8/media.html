<!DOCTYPE html>
<html>
<head>
    <title>Images, Hyperlinks and Iframes</title>
</head>

<body>

    <h1 align="center">Images, Hyperlinks and Iframes</h1>

    <hr>

    <h2>Student Image</h2>

    <img src="images/student.jpg"
         alt="Student Photo"
         width="250"
         height="250">

    <hr>

    <h2>Useful Hyperlinks</h2>

    <ul>
        <li>
            <a href="https://www.google.com" target="_blank">
                Google
            </a>
        </li>

        <li>
            <a href="https://www.github.com" target="_blank">
                GitHub
            </a>
        </li>

        <li>
            <a href="https://www.w3schools.com" target="_blank">
                W3Schools
            </a>
        </li>
    </ul>

    <hr>

    <h2>Embedded Webpage (Iframe)</h2>

    <iframe
        src="https://www.wikipedia.org"
        width="700"
        height="400">
    </iframe>

    <hr>

    <p align="center">
        <b>End of Experiment 8</b>
    </p>

</body>
</html>
