<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
        }

        .form {
            width: 400px;
            margin: 50px auto;
            padding: 25px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h2 {
            text-align: center;
        }

        input, select {
            width: 100%;
            padding: 8px;
            margin: 8px 0 15px;
            box-sizing: border-box;
        }

        input[type="submit"] {
            background: green;
            color: white;
            border: none;
            padding: 10px;
        }
    </style>
</head>

<body>

<div class="form">

    <h2>Student Registration</h2>

    <form action="register" method="post">

        Student Name:
        <input type="text" name="name">

        Register Number:
        <input type="text" name="regno">

        Email:
        <input type="email" name="email">

        Department:
        <select name="department">
            <option value="">Select Department</option>
            <option>Information Technology</option>
            <option>Computer Science</option>
            <option>ECE</option>
            <option>EEE</option>
        </select>

        Semester:
        <select name="semester">
            <option value="">Select Semester</option>
            <option>1</option>
            <option>2</option>
            <option>3</option>
            <option>4</option>
            <option>5</option>
            <option>6</option>
            <option>7</option>
            <option>8</option>
        </select>

        <input type="submit" value="Register">

    </form>

</div>

</body>
</html>
