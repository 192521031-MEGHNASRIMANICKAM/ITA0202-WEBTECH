<!DOCTYPE html>
<html>
<head>
    <title>Cross-Browser Compatible Webpage</title>

    <style>
        body {
            font-family: Arial;
            background: #eeeeee;
            text-align: center;
            padding: 30px;
        }

        .container {
            width: 500px;
            margin: auto;
            padding: 25px;
            background: white;
            border-radius: 10px;
        }

        #box {
            padding: 20px;
            margin: 20px;
            background: lightblue;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }

        /* Feature detection for CSS */
        @supports (display: flex) {
            .container {
                display: flex;
                flex-direction: column;
                align-items: center;
            }
        }

        /* Fallback for browsers without flexbox */
        @supports not (display: flex) {
            .container {
                display: block;
            }
        }

        .warning {
            color: red;
            font-weight: bold;
        }

        .success {
            color: green;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Cross-Browser Compatible Webpage</h2>

    <input type="text" id="name" placeholder="Enter your name">

    <br><br>

    <button id="saveBtn">Save Name</button>
    <button id="showBtn">Show Name</button>

    <div id="box">
        Welcome!
    </div>

    <p id="status"></p>

</div>


<script>

    /* ---------------------------------
       1. Check querySelector() support
       --------------------------------- */

    var status;

    if (document.querySelector) {

        status = document.querySelector("#status");

    } else {

        // Fallback for old browsers
        status = document.getElementById("status");
    }


    /* ---------------------------------
       2. Check localStorage support
       --------------------------------- */

    var storageSupported = false;

    try {

        if (typeof localStorage !== "undefined") {

            localStorage.setItem("test", "1");
            localStorage.removeItem("test");

            storageSupported = true;
        }

    } catch (e) {

        storageSupported = false;
    }


    /* ---------------------------------
       3. Display browser support
       --------------------------------- */

    if (storageSupported) {

        status.textContent =
            "Your browser supports localStorage.";

        status.className = "success";

    } else {

        status.textContent =
            "localStorage is not supported. Using fallback.";

        status.className = "warning";
    }


    /* ---------------------------------
       4. Save Name
       --------------------------------- */

    document.getElementById("saveBtn").onclick = function() {

        var name = document.getElementById("name").value;

        if (storageSupported) {

            localStorage.setItem("studentName", name);

            document.getElementById("box").textContent =
                "Name saved successfully!";

        } else {

            // Fallback: display directly on page
            document.getElementById("box").textContent =
                "Name: " + name;
        }
    };


    /* ---------------------------------
       5. Show saved Name
       --------------------------------- */

    document.getElementById("showBtn").onclick = function() {

        var name;

        if (storageSupported) {

            name = localStorage.getItem("studentName");

            if (name) {

                document.getElementById("box").textContent =
                    "Saved Name: " + name;

            } else {

                document.getElementById("box").textContent =
                    "No name has been saved.";
            }

        } else {

            // Fallback for browsers without localStorage
            document.getElementById("box").textContent =
                "localStorage unavailable. Please enter your name again.";
        }
    };

</script>

</body>
</html>
