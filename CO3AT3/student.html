<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>
    <style>
        .profile {
            background: #e8f4ff;
            border: 2px solid #2196f3;
            padding: 15px;
            margin-top: 20px;
            width: 300px;
        }
    </style>
</head>
<body>

<h2>Student Registration</h2>

<input id="name" placeholder="Name"><br><br>
<input id="regno" placeholder="Register Number"><br><br>
<input id="dept" placeholder="Department"><br><br>
<input id="year" placeholder="Year of Study"><br><br>

<button id="display">Display</button>
<button id="remove">Remove</button>

<div id="profile"></div>

<script>
document.getElementById("display").addEventListener("click", function () {

    let name = document.getElementById("name").value;
    let regno = document.getElementById("regno").value;
    let dept = document.getElementById("dept").value;
    let year = document.getElementById("year").value;

    let profile = document.getElementById("profile");

    profile.textContent =
        "Name: " + name + "\n" +
        "Register Number: " + regno + "\n" +
        "Department: " + dept + "\n" +
        "Year: " + year;

    profile.classList.add("profile");
    profile.style.whiteSpace = "pre-line";
});

document.getElementById("remove").addEventListener("click", function () {
    document.getElementById("profile").textContent = "";
    document.getElementById("profile").classList.remove("profile");
});
</script>

</body>
</html>
